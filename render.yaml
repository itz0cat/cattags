services:
  - type: web
    name: cattags-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build --workspace=shared && npm run build --workspace=backend
    startCommand: node backend/dist/index.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '*'
      - key: DATABASE_URL
        fromDatabase:
          name: cattags-db
          property: connectionString

databases:
  - name: cattags-db
    databaseName: cattags
    plan: free
    region: oregon
